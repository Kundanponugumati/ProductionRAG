[project]
name = "prag"
version = "0.1.0"
description = "Production-grade RAG over FinanceBench, built iteratively"
readme = "README.md"
authors = [
    { name = "kundanponugumati", email = "ponugumatikundansai@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.3",
    "openai>=3.23.0",
    "orjson>=3.12.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=5",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
prag = "prag.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
